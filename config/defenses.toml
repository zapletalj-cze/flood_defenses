# Settings of a run of the Defenses package. Only what you set is here; every other key comes from
# config/advanced.toml (defaults). A key written here overrides the same key there.
# Paths: forward slashes, e.g. "D:/data/dtm.tif". Check the inputs before a run: pixi run check

[general]
country = "NOR"                 # country of the runs (DEFENSES_COUNTRY overrides it)
work_dir = "D:/01_Projects/997_SmallProjects/99_DEFENSES/01_MD/work"        # intermediates (fast local disk)
output_dir = "D:/01_Projects/997_SmallProjects/99_DEFENSES/01_MD/outputs"   # results and logs
n_workers = 16                  # parallel unit processes; RAM need = n_workers x unit RAM
max_ram_gb_per_worker = 32.0    # build_units stops if a unit window would need more

# --- Inputs of the country (copy the tables and change the code for another country) ---
[countries.NOR]
dtm = ["Q:/01_Projects/165_Global_Flood_maps/01_MD/01_Europe/02_DTM/5m/nordics/nordics_5m_3035_260520_breached_GRITv06.tif"]
levees = ["D:/01_Projects/997_SmallProjects/99_DEFENSES/02_DATA/OSM/levees/europe-latest_man_made_embankment_or_dyke_lines.gpkg"]
rivers = ["R:/01_Projects/900_FL_Europe/01_MD/01_HAZARD/02_RN/MERIT/MERIT_3035/MERIT_RN_with_IFLakeType_260728_addFrom_To_point_IFAddArea.gpkg"]
river_upstream_area_field = "50"   # TO FIX: the NAME of the river column with the upstream area in km2 (not a value)
osm_pbf = "D:/01_Projects/900_FL_Europe/01_MD/01_HAZARD/01_DTM/GEDTM/europe-latest.osm.pbf"   # a country extract is much faster
geofabrik_region = ""           # alternative to osm_pbf: Geofabrik region to download

[countries.NOR.rp]
max_damage_csv = ""             # your table of maximum damage per category (rp_index.py)
depth_damage_csv = ""           # your depth-damage table: depth_m + one damage fraction column per category
