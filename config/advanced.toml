# HAND_YZ: land use / land cover exposure that supplements the GHSL building value (processing/HAND_YZ.py).
# Category values must cover only assets that GHSL buildings do not hold (crops, roads, rails, open-air equipment),
# otherwise buildings are counted twice.
[country_defaults.lulc]
enabled = false                 # rp_index.py adds the land cover value to the GHSL value when true
worldcover = []                 # local ESA WorldCover map tiles; empty = tiles of download_worldcover.py
urban_atlas = []                # optional Urban Atlas files (manual download); they take precedence where present
urban_atlas_layer = ""          # layer copied from multi-layer files with gdal.VectorTranslate
urban_atlas_class_field = ""    # NOT VERIFIED: field with the class code (a catalogue search shows code_2018)
# WorldCover class value -> exposure category. Class values are verified in the product legend (10 tree cover,
# 20 shrubland, 30 grassland, 40 cropland, 50 built-up, 60 bare/sparse vegetation, 70 snow and ice, 80 permanent
# water, 90 herbaceous wetland, 95 mangroves, 100 moss and lichen); the mapping itself is a placeholder.
worldcover_categories = { "40" = "agriculture", "50" = "built_up" }
urban_atlas_categories = {}     # NOT VERIFIED codes: Urban Atlas class code -> category; fill after checking the nomenclature
max_damage_csv = ""             # user provided: columns country + one per category, value per m2 of land
depth_damage_csv = ""           # user provided: depth_m + one damage fraction column per category

# River snapping (always applied by protected_areas.py): vertices every densify_m are projected onto the nearest guide
# line (country river_guides) within guide_search_m, then moved to the lowest DTM cell within window_m; sharp turns
# and short spikes are removed. Defaults follow the MERIT snapping procedure; without guide lines nothing moves
# unless max_shift_without_guide_m > 0.
[river_snap]
densify_m = 20.0
guide_search_m = 150.0
guide_max_shift_m = 180.0
window_m = 90.0                    # 9 cells of a 10 m DTM
max_shift_m = 120.0
max_shift_without_guide_m = 0.0
min_angle_deg = 35.0
angle_passes = 2
spike_angle_deg = 75.0
spike_length_m = 120.0
straight_angle_deg = 175.0
straight_length_factor = 0.25
straight_max_deviation_m = 2.0     # a nearly straight vertex is removed only this close to its neighbours' chord
spike_passes = 6
band_rows = 512                    # DTM rows read at a time

# Transport embankments from the DTM (transport_embankments.py): cross-sections along the lines of transport_lines,
# class per station (embankment, one-sided, cutting, at grade), openings (bridges, underpasses, probable culverts).
[transport]
station_spacing_m = 10.0        # cross-sections along each line
half_width_m = 40.0             # profile length on each side
crest_search_m = 6.0            # crest = highest cell within this distance of the line
side_near_m = 12.0              # terrain of a side: median of the profile between side_near_m
side_far_m = 30.0               # ... and side_far_m from the line
min_height_m = 0.5              # embankment: crest at least this much above the terrain of a side
footprint_fraction = 0.2        # footprint ends where the slope is within this share of the height above the terrain
min_segment_m = 50.0            # shorter class changes along a line are absorbed by their neighbour
break_window_m = 150.0          # reference crest: running median over this length
break_depth_m = 1.0             # bridge or underpass: crest at least this much below the reference crest
max_opening_m = 150.0           # longer breaks are gaps between separate embankments, not openings
culvert_window_m = 100.0        # probable culvert: lowest terrain of both sides within this distance along the line
culvert_min_depth_m = 0.3       # ... at least this much below the terrain on both sides along the line
stream_distance_m = 10.0        # a river line this close to an opening or crossing an embankment marks drainage
cross_sections_per_class = 6    # cross-section plots per class

[sources]
request_pause_s = 1.0           # pause between requests; retry k waits request_pause_s * 2**k
max_retries = 4
# GHSL built-up volume (R2023A, 100 m): URL templates with {epoch} and {tile}, tiling schema (vector file or URL,
# zipped shapefile allowed) and the schema attribute holding the tile id. NOT VERIFIED: fill from the JRC GHSL
# documentation (tile naming not confirmed).
ghsl_url_templates = { total = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_V_GLOBE_R2023A/GHS_BUILT_V_E{epoch}_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_BUILT_V_E{epoch}_GLOBE_R2023A_54009_100_V1_0_{tile}.zip", non_residential = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_V_GLOBE_R2023A/GHS_BUILT_V_NRES_E{epoch}_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_BUILT_V_NRES_E{epoch}_GLOBE_R2023A_54009_100_V1_0_{tile}.zip", smod = "", pop = "" }   # optional SMOD and population products are not configured
ghsl_tile_schema = "https://ghsl.jrc.ec.europa.eu/download/GHSL_data_54009_shapefile.zip"
ghsl_tile_field = "tile_id"
ghsl_epoch = 0                  # 0 = latest available observed epoch; 2030 is modelled
ghsl_nodata_as_zero = true      # GHSL nodata (ocean, outside coverage) counts as no building volume
# Copernicus GFM through its STAC API (plain HTTP + JSON). Verified on 2026-11-13 against the service (search, files
# read without a login, values and CRS read from the files): docs/stage_h_gfm_access.md. Observed layers only.
# Licence: CEMS terms of service; notice "Generated using (or: Contains modified) Copernicus Emergency Management
# Service information [Year]".
gfm_stac_url = "https://stac.eodc.eu/api/v1"
gfm_collection = "GFM"
gfm_assets = { flood = "ensemble_flood_extent", exclusion = "exclusion_mask", reference_water = "reference_water_mask", likelihood = "ensemble_likelihood", advisory = "advisory_flags" }
gfm_date_from = "2015-01-01"
gfm_date_to = ""                # empty = until today
gfm_page_limit = 100            # items per STAC page
gfm_token_env = ""              # environment variable holding a bearer token, if the service requires one
gfm_screen_resolution_m = 100.0 # flood extent screened at this resolution before a scene is downloaded
gfm_download_threads = 4        # scenes screened and copied at the same time (network-bound)
# Pixel conventions of the GFM layers, read from the files and the Product User Manual (V20251201).
gfm_flood_values = [1]
gfm_exclusion_values = [1]
gfm_reference_water_values = [1, 2]   # permanent and seasonal water of the monthly mask
gfm_nodata_values = [255]
gfm_advisory_values = [1, 2, 3]       # 1 low regional backscatter (frost, snow, dry soil), 2 rough water (wind), 3 both
# ESA WorldCover 10 m (CC BY 4.0). Verified: URL pattern and grid from the official ESA-WorldCover download script,
# a tile request (HTTP 200) and the legend in the tile metadata.
worldcover_url_template = "https://esa-worldcover.s3.eu-central-1.amazonaws.com/{version}/{year}/map/ESA_WorldCover_10m_{year}_{version}_{tile}_Map.tif"
worldcover_grid_url = "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v100/2020/esa_worldcover_2020_grid.geojson"
worldcover_tile_field = "ll_tile"   # tile name field of the grid (lower-left corner, e.g. N48E015)
worldcover_version = "v200"
worldcover_year = 2021

[evidence]
comparison_distance_m = 2000.0
min_valid_pixels = 200
f_wet_comparison = 0.5          # placeholder
f_dry_inside = 0.05             # placeholder
f_wet_inside = 0.3              # placeholder
river_level_percentile = 90.0   # scene water level in HAND for missing-barrier hints
hint_margin_m = 0.5             # placeholder: a cell is clearly below the scene level by this margin
hint_dry_share = 0.8            # placeholder: share of tested scenes in which a hint cell stays dry
hint_min_scenes = 3             # placeholder: minimum number of tested scenes per hint cell
max_extent_files = []           # optional: official GFM maximum flood extent rasters ordered in the portal (README 10.0)
use_advisory_flags = false      # true: cells with a GFM advisory flag are not valid observations (needs the advisory layer)
hint_exclusion_m = 40.0         # placeholder: cells this close to a barrier line or protected area are not tested

