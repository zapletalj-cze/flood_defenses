# config/defenses.toml holds the settings of a run; every key set there overrides the same key here, so this file
# normally stays unchanged. [country_defaults] (with its sub-tables) applies to every country; a table
# [countries.<code>...] in defenses.toml overrides it key by key. Request and template tables are replaced whole.
