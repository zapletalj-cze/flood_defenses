[implied.plots]
enabled = true
dpi = 120
max_per_type = 200
sample_seed = 42
show_max = 10
plot_all_in_units = []

# --- Stage F: discharge sources GloFAS and EFAS (replaces the GloFAS keys of [sources] and [evidence]) ---
# Discharge only turns observed outcomes into return periods; it never delineates protected areas and is never a hazard.
# Request parameters, data formats, years, the EFAS variable and the EFAS upstream area source are copied from the
# EWDS download form ("Show API request") and never guessed: entries marked "from the form" stay empty until then.
# The personal EWDS key goes into ~/.cdsapirc (url and key) or CDSAPI_KEY, never into this file.
# Flood events from the prepared discharge series (flood_events.py, Stage H): per river group, peaks of at least
# min_peak_rp at the discharge cell matched to the group; window from days_before before the peak to days_after
# after it; overlapping windows are merged. Placeholders: confirm on the pilot events.
[events]
min_peak_rp = 2.0               # smallest return period (years) of a peak that starts an event
days_before = 5                 # window start before the peak
days_after = 21                 # window end after the peak (water behind a levee stays visible)

[discharge]
sources = ["efas", "glofas"]
source_mode = "conservative_both"          # prefer_efas, prefer_glofas or conservative_both
ewds_api_url = "https://ewds.climate.copernicus.eu/api"   # verified; file:///folder serves files downloaded by hand
raw_dir = ""                               # empty: <work_dir>/<country>/discharge/raw
aggregation = "daily_mean"                 # daily_mean or daily_max (daily_max only for 6-hourly data)
hydrological_year_start_month = 1
min_years = 20
max_rp_extrapolation = 1000
flooded_window_days = 3
max_parallel_requests = 2
bbox_buffer_deg = 0.1
rp_disagreement_ratio = 3.0

[discharge.glofas]
dataset_id = "cems-glofas-historical"      # verified
request = { system_version = ["version_5_0"], hydrological_model = ["lisflood"], product_type = ["consolidated"], timespan = ["time_mean"], variable = ["average_river_discharge_in_the_last_24_hours"] }   # from the EWDS form (time, area and formats are added by download_discharge.py)
data_format = "netcdf"                           # from the form (e.g. its grib or netcdf value)
download_format = "unarchived"                       # from the form; empty = not sent
first_year = 1980                             # from the dataset overview
last_year = 2026
request_unit = "year"
time_keys = {year = "year", month = "month", day = "day"}                             # from the form: { year = "...", month = "...", day = "..." }
area_key = "area"                     # EWDS parameter; the bbox is derived from dtm_footprint.gpkg
step_hours = 24                            # verified: daily (24-hourly) discharge
valid_time_marks = "end"                   # to confirm: ECMWF documents the valid time as the end of the averaging period
netcdf_variable = ""                       # variable of the downloaded NetCDF files (empty for GRIB)
upstream_area_file = ""                    # glofas_upArea.nc (Documentation tab of the dataset)
upstream_area_variable = ""                # variable of glofas_upArea.nc
upstream_area_to_km2 = 1e-6                # verified: glofas_upArea.nc is in m2
min_upstream_area_km2 = 50.0               # cells kept for matching; memory of the series = days x cells x 4 B
search_radius_km = 5.0
upstream_ratio_min = 0.7
upstream_ratio_max = 1.3
match_river_distance_m = 3000.0            # cell centre to the river line: about half a 0.05 deg cell diagonal

[discharge.efas]
dataset_id = "efas-historical"             # verified; access to verify
request = { system_version = ["version_5_0"], variable = ["river_discharge_in_the_last_6_hours"], model_levels = "surface_level", time = ["00:00", "06:00", "12:00", "18:00"] }
data_format = "netcdf"
download_format = "unarchived"
first_year = 1992
last_year = 2026
request_unit = "month"                     # 6-hourly data: a month stays below 500 layers
time_keys = { year = "hyear", month = "hmonth", day = "hday" }
area_key = "area"
step_hours = 6                             # verified: EFAS v5.0 has a 6-hourly step
valid_time_marks = "end"                   # to confirm (EFAS v5.0 historical had a 6 h archive shift, since corrected)
netcdf_variable = ""
upstream_area_file = ""                    # EFAS static upstream area, source to verify
upstream_area_variable = ""
upstream_area_to_km2 = 0                   # units of the EFAS upstream area file, to verify (0 stops discharge_prepare.py)
min_upstream_area_km2 = 50.0               # 0 keeps every land cell of the box (about 3 GB of series for a country)
search_radius_km = 2.0
upstream_ratio_min = 0.7
upstream_ratio_max = 1.3
match_river_distance_m = 500.0             # cell centre to the river line (1 arcmin cells)
