[workspace]
name = "flood_defenses"
authors = ["Jakub Zapletal <jakub.zapletal00@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.11"
gdal = ">=3.11"
numpy = "*"
scipy = "*"
numba = "*"
geopandas = ">=1.0"
shapely = ">=2.0"
pyproj = "*"
# required by the existing import in gis.py (depends on affine, numba, numpy, scipy; no rasterio)
pyflwdir = "*"

# Scripts run as modules from the repository root, so `import gis` resolves without sys.path changes.
[tasks]
prepare-dtm = "python -m processing.prepare_dtm"
build-units = "python -m processing.build_units"
compartments = "python -m processing.compartments"
test-kernels = "python -m tests.test_kernels"
download-osm = "python -m download.download_osm"
osm-hydraulics = "python -m processing.osm_hydraulics"
download-ghsl = "python -m download.download_ghsl"
rp-index = "python -m processing.rp_index"
test-pipeline = "python -m tests.test_pipeline"
test-stage-b = "python -m tests.test_stage_b"
make-benchmark-world = "python -m tests.make_benchmark_world"
