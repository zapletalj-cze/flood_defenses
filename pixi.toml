[workspace]
name = "flood_defenses"
authors = ["Jakub Zapletal <jakub.zapletal@aon.com>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.11"
gdal = ">=3.11"
# GDAL drivers packaged as plugins on conda-forge: NetCDF and GRIB (GloFAS discharge and upstream area)
libgdal-netcdf = "*"
libgdal-grib = "*"
numpy = "*"
scipy = "*"
numba = "*"
geopandas = ">=1.0"
# already used by gis.py; 2.0 or newer for ISO 8601 date parsing
pandas = ">=2.0"
shapely = ">=2.0"
pyproj = "*"
# required by the existing import in gis.py (depends on affine, numba, numpy, scipy; no rasterio)
pyflwdir = "*"
# Stage E plots (approved); the base package without Qt
matplotlib-base = "*"
# Stage F downloads from the Copernicus EWDS (approved); 0.7 or newer for the current data stores
cdsapi = ">=0.7.4"

# Scripts run as modules from the repository root, so `import gis` resolves without sys.path changes.
[tasks]
# Desktop GUI, an alternative to the shell (local web application, standard library only)
gui = "python -m gui.app"
check = "python -m processing.check_inputs"
report = "python -m processing.data_report"
make-figures = "python -m docs.make_figures"
prepare-dtm = "python -m processing.prepare_dtm"
build-units = "python -m processing.build_units"
protected-areas = "python -m processing.protected_areas"
transport-embankments = "python -m processing.transport_embankments"
flood-events = "python -m processing.flood_events"
test-kernels = "python -m tests.test_kernels"
download-ghsl = "python -m download.download_ghsl"
rp-index = "python -m processing.rp_index"
download-worldcover = "python -m download.download_worldcover"
hand-yz = "python -m processing.HAND_YZ"
download-clms = "python -m download.download_clms"
context-zones = "python -m processing.context_zones"
download-gfm = "python -m download.download_gfm"
gfm-evidence = "python -m processing.gfm_evidence"
download-discharge = "python -m download.download_discharge"
discharge-prepare = "python -m processing.discharge_prepare"
rp-bounds = "python -m processing.rp_bounds"
validate = "python -m processing.validate"
test-pipeline = "python -m tests.test_pipeline"
test-stage-b = "python -m tests.test_stage_b"
test-stage-c = "python -m tests.test_stage_c"
test-hand-yz = "python -m tests.test_hand_yz"
test-stage-d = "python -m tests.test_stage_d"
make-benchmark-world = "python -m tests.make_benchmark_world"
snap-rivers = "python -m processing.snap_rivers"
implied-segments = "python -m processing.implied_segments"
implied-protection = "python -m processing.implied_protection"
implied-evaluate = "python -m processing.implied_evaluate"
test-stage-e = "python -m tests.test_stage_e"
test-stage-f = "python -m tests.test_stage_f"
test-gui = "python -m tests.test_gui"
test-transport = "python -m tests.test_transport"
test-stage-h = "python -m tests.test_stage_h"
